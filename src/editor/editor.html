<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoDoc Editor</title>
  <meta name="description" content="AutoDoc documentation editor - review, edit, and export your recorded steps" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <!-- ═══════════════════════════════════════════════════
       TOP NAVIGATION BAR
  ════════════════════════════════════════════════════ -->
  <nav class="topbar" id="topbar">
    <div class="topbar-left">
      <div class="logo">
        <div class="logo-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4" fill="white"/>
            <path d="M9 2L7.5 4H4a1 1 0 00-1 1v14a1 1 0 001 1h16a1 1 0 001-1V5a1 1 0 00-1-1h-3.5L15 2H9z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="logo-text">AutoDoc</span>
      </div>
      <div class="divider"></div>
      <input
        type="text"
        class="session-name-input"
        id="session-name-input"
        placeholder="Session name..."
        autocomplete="off"
      />
      <div class="topbar-metadata" id="topbar-metadata" style="display:none">
        <span class="topbar-meta-tag" id="topbar-meta-feature"></span>
        <span class="topbar-meta-sep">·</span>
        <span class="topbar-meta-tag env" id="topbar-meta-env"></span>
        <span class="topbar-meta-sep">·</span>
        <span class="topbar-meta-date" id="topbar-meta-date"></span>
      </div>
    </div>
    <div class="topbar-center">
      <div class="step-counter-badge" id="step-counter-badge">
        <span id="total-steps">0</span> steps
      </div>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn" id="btn-add-note" title="Insert a text note">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Add Note
      </button>
      <button class="topbar-btn" id="btn-export-html" title="Export as HTML">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
        HTML
      </button>
      <button class="topbar-btn" id="btn-download-screenshots" title="Download all screenshots as PNG files">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Screenshots
      </button>
      <button class="topbar-btn btn-accent" id="btn-export-pdf" title="Export as PDF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Export PDF
      </button>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════
       MAIN LAYOUT
  ════════════════════════════════════════════════════ -->
  <div class="editor-layout">

    <!-- ── LEFT SIDEBAR: Step Thumbnails ────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Steps</span>
        <button class="icon-btn" id="btn-renumber" title="Renumber all steps">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 014-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 01-4 4H3"/>
          </svg>
        </button>
      </div>

      <!-- Empty state -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📷</div>
        <div class="empty-title">No steps yet</div>
        <div class="empty-text">Start recording to capture your first step.</div>
      </div>

      <!-- Sortable thumbnail list -->
      <ul class="step-list" id="step-list" role="list"></ul>
    </aside>

    <!-- ── MAIN PANEL: Step Detail View ─────────────────── -->
    <main class="main-panel" id="main-panel">

      <!-- Welcome / empty state -->
      <div class="welcome-panel" id="welcome-panel">
        <div class="welcome-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4" fill="#7c3aed" opacity="0.3"/>
            <path d="M9 2L7.5 4H4a1 1 0 00-1 1v14a1 1 0 001 1h16a1 1 0 001-1V5a1 1 0 00-1-1h-3.5L15 2H9z" stroke="#7c3aed" stroke-width="1.5"/>
          </svg>
        </div>
        <h1 class="welcome-title">AutoDoc Editor</h1>
        <p class="welcome-text">Select a step from the sidebar to view and edit it,<br/>or start recording to capture new steps.</p>
      </div>

      <!-- Step detail view (hidden until step selected) -->
      <div class="step-detail" id="step-detail" style="display:none">

        <!-- Step header -->
        <div class="detail-header">
          <div class="detail-badge" id="detail-badge">STEP 1</div>
          <div class="detail-meta">
            <span class="detail-url" id="detail-url"></span>
            <span class="detail-timestamp" id="detail-timestamp"></span>
          </div>
          <div class="detail-actions">
            <button class="icon-btn danger" id="btn-delete-step" title="Delete this step">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                <path d="M10 11v6M14 11v6"/>
                <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Screenshot view -->
        <div class="screenshot-container" id="screenshot-container">
          <img
            class="screenshot-img"
            id="screenshot-img"
            src=""
            alt="Step screenshot"
          />
          <div class="screenshot-overlay">
            <button class="screenshot-btn" id="btn-view-fullscreen" title="View full size">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Element info (if available) -->
        <div class="element-info" id="element-info" style="display:none">
          <span class="element-tag" id="element-tag"></span>
          <span class="element-text" id="element-text"></span>
        </div>

        <!-- Description editor -->
        <div class="description-section">
          <label class="description-label" for="step-description">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Description
          </label>
          <textarea
            class="description-textarea"
            id="step-description"
            placeholder="Describe this step... (e.g. 'Click the Login button to access the dashboard')"
            rows="4"
          ></textarea>
          <div class="description-footer">
            <span class="char-count" id="char-count">0 characters</span>
            <button class="text-btn" id="btn-auto-desc">✨ Auto-generate</button>
          </div>
        </div>

        <!-- Navigation arrows -->
        <div class="step-navigation">
          <button class="nav-btn" id="btn-prev-step" title="Previous step">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Previous
          </button>
          <span class="nav-indicator" id="nav-indicator">1 / 1</span>
          <button class="nav-btn" id="btn-next-step" title="Next step">
            Next
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- ═══════════════════════════════════════════════════
       MODALS & OVERLAYS
  ════════════════════════════════════════════════════ -->

  <!-- Fullscreen image viewer -->
  <div class="fullscreen-overlay" id="fullscreen-overlay" style="display:none">
    <button class="fullscreen-close" id="fullscreen-close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <img class="fullscreen-img" id="fullscreen-img" src="" alt="Full-size screenshot" />
  </div>

  <!-- Add Note Modal -->
  <div class="modal-overlay" id="note-modal-overlay" style="display:none">
    <div class="modal" id="note-modal">
      <div class="modal-header">
        <span>Insert Text Note</span>
        <button class="icon-btn" id="note-modal-close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="description-label" for="note-content">Note Content</label>
        <textarea
          class="description-textarea"
          id="note-content"
          placeholder="Add a note between steps (e.g. 'At this point, ensure you are logged in as an admin user.')"
          rows="5"
        ></textarea>
        <label class="description-label" style="margin-top:12px;" for="note-position">Insert After Step</label>
        <select class="select-input" id="note-position">
          <option value="-1">At the beginning</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="note-cancel">Cancel</button>
        <button class="btn-confirm" id="note-confirm">Insert Note</button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- Loading overlay for PDF export -->
  <div class="export-loading" id="export-loading" style="display:none">
    <div class="export-spinner"></div>
    <div class="export-text" id="export-loading-text">Generating PDF...</div>
  </div>

  <script src="editor.js" type="module"></script>
</body>
</html>
